name: Pipeline Movida

on:
  schedule:
    # Roda a cada 30 minutos das 8h às 18h (Horário de Brasília = 11h às 21h UTC)
    - cron: "0,30 11-21 * * 1-5"
  workflow_dispatch: # Permite rodar manualmente clicando em um botão

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Instalar dependências do projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar o Pipeline de Dados
        env:
          DB_URL: ${{ secrets.DB_URL }}
          SUPA_URL: ${{ secrets.SUPA_URL }}
          SUPA_KEY: ${{ secrets.SUPA_KEY }}
        run: python main.py
